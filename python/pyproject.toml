[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "lastshoot"
version = "0.1.1"
description = "Official Python client for the LastShoot AI product-photography API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LastShoot" }]
keywords = ["lastshoot", "ai", "product photography", "virtual try-on", "background removal", "image generation", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "respx>=0.21", "mypy>=1.8", "build", "twine"]

[project.urls]
Repository = "https://github.com/lastshoot-com/lastshoot-sdks"
Issues = "https://github.com/lastshoot-com/lastshoot-sdks/issues"
Homepage = "https://www.lastshoot.com"
Documentation = "https://www.lastshoot.com/docs/sdks/python"
"API reference" = "https://api.lastshoot.com/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/lastshoot"]

[tool.hatch.build.targets.sdist]
include = ["src/lastshoot", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/lastshoot"]
